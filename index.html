<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Min Law SCT Assistant — Issue Distillation (test harness)</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.25rem; }
  .notice {
    font-size: 0.85rem;
    opacity: 0.75;
    border-left: 3px solid currentColor;
    padding-left: 0.75rem;
    margin-bottom: 1.5rem;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 160px;
    font-family: inherit;
    font-size: 1rem;
    padding: 0.75rem;
  }
  .counter { font-size: 0.85rem; opacity: 0.7; margin-top: 0.25rem; }
  .counter.warn { color: #b45309; opacity: 1; }
  .counter.stop { color: #b91c1c; opacity: 1; font-weight: bold; }
  button {
    margin-top: 0.75rem;
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
  #output { margin-top: 1.5rem; }
  .block {
    border: 1px solid currentColor;
    border-radius: 6px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.75rem;
    opacity: 0.9;
  }
  .block p { white-space: pre-wrap; margin: 0 0 0.5rem 0; }
  .block button { margin: 0; padding: 0.25rem 0.6rem; font-size: 0.8rem; }
  .error { color: #b91c1c; }
  .flags { font-size: 0.8rem; opacity: 0.7; margin-top: 1rem; }
</style>
</head>
<body>

<h1>Min Law SCT Assistant — Issue Distillation</h1>
<p class="notice">
  This is a plain test page for Feature 1, not the Chrome extension UI.
  It talks directly to this same backend at <code>/api/distill-issue</code>.
</p>

<label for="input">Tell us what happened, in your own words:</label>
<textarea id="input" placeholder="e.g. I hired a photographer for my wedding off Instagram..."></textarea>
<div id="counter" class="counter">0 words</div>

<button id="submit">Generate structured summary</button>

<div id="output"></div>

<script>
  const SOFT_WORD_LIMIT = 500;   // moderate tier, see CLAUDE.md
  const HARD_WORD_LIMIT = 1000;

  const input = document.getElementById("input");
  const counter = document.getElementById("counter");
  const submitBtn = document.getElementById("submit");
  const output = document.getElementById("output");

  function wordCount(text) {
    return text.trim().split(/\s+/).filter(Boolean).length;
  }

  function updateCounter() {
    const words = wordCount(input.value);
    counter.textContent = `${words} words`;
    counter.className = "counter";
    if (words > HARD_WORD_LIMIT) {
      counter.classList.add("stop");
      counter.textContent += ` — over the ${HARD_WORD_LIMIT}-word limit, consider splitting unrelated issues into separate submissions`;
    } else if (words > SOFT_WORD_LIMIT) {
      counter.classList.add("warn");
      counter.textContent += ` — longer than most accounts need; consider trimming or splitting`;
    }
  }

  function splitIntoBlocks(text) {
    return text.split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean);
  }

  function renderOutput(replyText, flags) {
    output.innerHTML = "";

    const header = document.createElement("div");
    header.innerHTML = `<strong>Structured summary</strong> `;
    const copyAllBtn = document.createElement("button");
    copyAllBtn.textContent = "Copy all";
    copyAllBtn.onclick = () => navigator.clipboard.writeText(replyText);
    header.appendChild(copyAllBtn);
    output.appendChild(header);

    for (const block of splitIntoBlocks(replyText)) {
      const el = document.createElement("div");
      el.className = "block";
      const p = document.createElement("p");
      p.textContent = block;
      const copyBtn = document.createElement("button");
      copyBtn.textContent = "Copy";
      copyBtn.onclick = () => navigator.clipboard.writeText(block);
      el.appendChild(p);
      el.appendChild(copyBtn);
      output.appendChild(el);
    }

    if (flags && flags.length > 0) {
      const flagsEl = document.createElement("div");
      flagsEl.className = "flags";
      flagsEl.textContent = `[dev note] guardrail flagged: ${flags.join(", ")} — read the output above before trusting it`;
      output.appendChild(flagsEl);
    }
  }

  input.addEventListener("input", updateCounter);

  submitBtn.addEventListener("click", async () => {
    const text = input.value.trim();
    if (!text) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Generating...";
    output.innerHTML = "";

    try {
      const res = await fetch("/api/distill-issue", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_message: text }),
      });

      const data = await res.json();

      if (!res.ok) {
        output.innerHTML = `<p class="error">Error: ${data.detail || res.statusText}</p>`;
      } else {
        renderOutput(data.reply, data.guardrail_flags);
      }
    } catch (err) {
      output.innerHTML = `<p class="error">Request failed: ${err.message}. Is the backend running?</p>`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Generate structured summary";
    }
  });

  updateCounter();
</script>

</body>
</html>
